<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Tn Production</title>
  <meta name="description" content="Contact Tn Production by form, email, phone, or WhatsApp.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="page">
  <div class="container">
    <h1>Contact us</h1>
    <p class="muted">Send us a message and we will reply as soon as we can.</p>

    <div class="cart-layout">

      <section>
        <form id="contact-form" novalidate>
          <div class="form-grid">
            <div class="field" data-field="name">
              <label for="k-name">Your name</label>
              <input id="k-name" name="name" type="text" autocomplete="name" required>
              <p class="error-text">Please enter your name.</p>
            </div>
            <div class="field" data-field="email">
              <label for="k-email">Your email</label>
              <input id="k-email" name="email" type="email" autocomplete="email" required>
              <p class="error-text">Please enter a valid email address.</p>
            </div>
            <div class="field full" data-field="message">
              <label for="k-message">Message</label>
              <textarea id="k-message" name="message" rows="6" required></textarea>
              <p class="error-text">Please enter a message.</p>
            </div>
          </div>
          <p class="msg error" id="contact-msg" role="alert"></p>
          <button class="btn" type="submit" style="margin-top:12px">Send message</button>
        </form>
      </section>

      <aside class="summary" aria-label="Contact details">
        <h2 style="font-size:1.2rem">Contact details</h2>
        <p id="c-email-line"></p>
        <p id="c-phone-line"></p>
        <p id="c-whatsapp-line"></p>

        <h3 style="margin-top:20px">Follow us</h3>
        <ul id="c-social" style="list-style:none; padding:0; margin:0"></ul>
      </aside>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/common.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
